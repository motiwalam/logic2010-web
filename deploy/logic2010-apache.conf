# Logic 2010 web app: https://motiwala.ca/logic2010/ is served by a Node server on
# 127.0.0.1:8710 (systemd unit logic2010.service). Installed by the logic2010 repository's
# deploy/deploy.sh as /etc/httpd/conf.d/logic2010.conf; edit it there, not here.
#
# Only /logic2010 and paths under /logic2010/ are affected. The server keeps the /logic2010
# prefix itself, so paths are passed through unchanged. Requires mod_proxy_http and
# mod_headers (both loaded by default on CentOS). SELinux: needs httpd_can_network_connect.

# The app lives at /logic2010/ (with the slash); the bare path redirects there.
RedirectMatch 301 "^/logic2010$" "/logic2010/"

<Location "/logic2010/">
    ProxyPass "http://127.0.0.1:8710/logic2010/" retry=0 timeout=60
    ProxyPassReverse "http://127.0.0.1:8710/logic2010/"
    ProxyPreserveHost On
    # Apache adds X-Forwarded-For and X-Forwarded-Host itself.
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
</Location>
