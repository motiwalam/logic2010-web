<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f9" />
    <meta name="description" content="Logic 2010 in the browser: symbolization, parsing, truth tables, derivations, invalidity and rule recognition exercises from UCLA's formal logic course." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d3f7a'/%3E%3Crect x='13' y='6.5' width='6' height='6' fill='%23f2b53a'/%3E%3Crect x='6' y='18.5' width='6' height='6' fill='%23f2b53a'/%3E%3Crect x='20' y='18.5' width='6' height='6' fill='%23f2b53a'/%3E%3C/svg%3E" />
    <title>Logic 2010</title>
    <script>
      // Apply the theme before the first paint (see src/ui/prefs.ts).
      try {
        var p = JSON.parse(localStorage.getItem('logic2010:prefs') || '{}');
        var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (p.highContrast) document.documentElement.dataset.contrast = 'high';
        if (p.textScale) document.documentElement.style.setProperty('--text-scale', String(p.textScale));
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Logic 2010 needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
